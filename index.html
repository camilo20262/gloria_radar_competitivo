<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar Competitivo · Gloria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@1,700;1,800&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Radar Competitivo · Gloria Perú. Reporte editorial (portada por departamento → reporte numerado).
   Paleta Gloria: azul noche #150A3F, índigo #2F2A86, celeste #65D6EC, crema #F8F4EE; rojo #DD1A20 solo en el logo. */
:root{
  --paper:#F8F4EE; --paper-2:#EFE8DC; --card:#FFFFFF;
  --ink:#150A3F; --ink-mid:#3A3358; --ink-low:#5D5874; --ink-faint:#9A95AC;
  --line:rgba(21,10,63,.10); --line-2:rgba(21,10,63,.18);
  --accent:#2F2A86; --accent-txt:#2F2A86; --cel:#65D6EC; --cel-2:#2FB3CC;
  --accent-soft:rgba(47,42,134,.10);
  --bar:#7A7494; --prev:#B4AEC4;
  --s1:#2F2A86; --s2:#2FB3CC; --s3:#E0A100; --s4:#2E9E5B; --s5:#C2367A; --s6:#7B61C9; --other:#D6D0C4;
  --good:#1D7A47; --bad:#B42318;
  --deep:#150A3F; --deep-fg:#F8F4EE; --deep-low:rgba(248,244,238,.68);
  --warn-bg:rgba(224,161,0,.10); --warn-line:#D99400; --warn-ink:#7A5200;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-serif:'Fraunces',Georgia,serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --radius:18px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 56px}
.mono{font-family:var(--f-mono)}
em.g{font-family:var(--f-serif);font-style:italic;font-weight:800;text-transform:none;letter-spacing:-.01em;background:linear-gradient(100deg,#150A3F,#2F2A86 45%,#2FB3CC);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.12em;margin-right:-.05em}

/* panel de configuración */
.cfg{background:var(--deep);color:var(--deep-fg);padding-inline:clamp(16px,3vw,32px);padding-block:12px;position:relative}
.cfg:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--cel) 0 70%,var(--cel-2) 70%)}
.cfg-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:end;gap:12px 22px;padding-bottom:4px}
.cfg-brand{display:flex;align-items:center;gap:12px;align-self:center}
.logo{background:#fff;border-radius:10px;padding:4px 9px;display:inline-flex;align-items:center}
.logo img{height:36px;width:auto;display:block}
.cfg-tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--deep-low);max-width:26ch}
.cfg label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep-low)}
.cfg select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 11px;color:var(--deep-fg);font-family:var(--f-body);font-size:14px;letter-spacing:0;text-transform:none;width:16rem;max-width:100%}
.cfg select option{color:#150A3F;background:#fff}
.cfg .pbtn{margin-left:auto;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--deep-fg);border-radius:999px;padding:9px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer}
.cfg .pbtn:hover{background:rgba(255,255,255,.1)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;border:0;border-radius:999px;background:var(--deep);color:var(--deep-fg);padding:10px 15px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:.35}
.fab:hover,.fab:focus-visible{opacity:1}

/* comunes */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 6px}
.home{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.home .logo{box-shadow:0 1px 0 var(--line-2)}.home .logo img{height:30px}
.home b{color:var(--accent)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink);border:1.5px solid var(--line-2);border-radius:999px;padding:8px 15px;background:var(--card);cursor:pointer;white-space:nowrap}
.pill-btn:hover{border-color:var(--accent);color:var(--accent)}
.mock{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border:1px dashed var(--warn-line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.badge{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px;white-space:nowrap}
.sec{margin-top:64px}
.sec-num{font-family:var(--f-mono);font-size:11px;color:var(--cel-2);letter-spacing:.3em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.sec-title{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,3.4vw,42px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
.sec-lead{color:var(--ink-low);max-width:64ch;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,2.4vw,28px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap;margin-bottom:20px}
.card-t{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;text-transform:uppercase}
.note{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-low);margin-top:4px}
.foot{font-size:12px;color:var(--ink-low);border-top:1px solid var(--line);margin-top:20px;padding-top:12px}
.key{background:var(--paper);border-radius:14px;padding:16px 18px;font-size:14px;color:var(--ink-mid);min-width:0}
.key-t{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.key b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-mid)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.cpill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:900;font-family:var(--f-display);letter-spacing:-.02em;border-radius:100px;padding:2px 12px}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.seg-ctl{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--paper-2);border-radius:999px;padding:4px;margin-bottom:16px}
.seg-ctl button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink-mid)}
.seg-ctl button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* portada */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:26px 10px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5.4vw,72px);line-height:.93;letter-spacing:-.04em;text-transform:uppercase;margin:0 0 26px;text-wrap:balance}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.hpill{display:inline-flex;align-items:baseline;gap:9px;border:1.5px solid var(--line-2);border-radius:999px;padding:9px 18px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);font-weight:700}
.hpill b{font-family:var(--f-display);font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.hpill.acc{border-color:var(--accent)}.hpill.acc b{color:var(--accent)}
.hero-sub{color:var(--ink-low);max-width:48ch;margin:0}
.radar{position:relative;width:min(100%,380px);aspect-ratio:1;margin-inline:auto;border-radius:50%;background:radial-gradient(circle,var(--card) 0,var(--paper-2) 100%);border:1px solid var(--line-2);overflow:hidden}
.radar .ring{position:absolute;inset:var(--i);border-radius:50%;border:1px dashed var(--line-2)}
.radar .ax{position:absolute;background:var(--line-2)}
.radar .ax.h{left:0;right:0;top:50%;height:1px}.radar .ax.v{top:0;bottom:0;left:50%;width:1px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(101,214,236,.45) 360deg);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-low);white-space:nowrap}
.blip i{width:9px;height:9px;border-radius:50%;background:var(--bar);box-shadow:0 0 0 3px var(--card)}
.blip.me{color:var(--ink);font-weight:700}.blip.me i{width:13px;height:13px;background:var(--accent);box-shadow:0 0 0 3px var(--card),0 0 0 7px var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.radar .sweep{animation:none}}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pp{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.pp:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(21,10,63,.08)}
.pp.nat{background:var(--deep);color:var(--deep-fg);border-color:var(--deep)}
.pp.nat .pp-head,.pp.nat .pp-stats .k{color:var(--deep-low)}.pp.nat .iso{background:rgba(255,255,255,.12);color:var(--deep-fg)}.pp.nat .pp-stats{border-top-color:rgba(255,255,255,.2)}.pp.nat .v.me{color:var(--cel)}
.pp.soon{cursor:default;opacity:.6}.pp.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-low);font-weight:700}
.pp-live{color:var(--good)}.pp.nat .pp-live{color:var(--cel)}
.pp-id{display:flex;align-items:center;gap:11px}
.iso{display:grid;place-items:center;min-width:38px;height:28px;padding:0 5px;border-radius:6px;background:var(--paper-2);font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink-mid)}
.pp-country{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
.pp-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;border-top:1px dashed var(--line-2);padding-top:12px}
.pp-stats .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.pp-stats .v{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pp-stats .v.me{color:var(--accent)}
.cmp-head{display:flex;justify-content:space-between;align-items:end;gap:12px 30px;flex-wrap:wrap;margin-bottom:18px}
.cmp-title{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,36px);line-height:1;letter-spacing:-.03em;text-transform:uppercase}
.cmp-sub{color:var(--ink-low);max-width:46ch;font-size:14px}
.tscroll{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--card)}
table.cmp{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
.cmp th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-low);text-align:left;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmp td{padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp tr:last-child td{border-bottom:0}
.cmp tbody tr{cursor:pointer}.cmp tbody tr:hover td{background:var(--paper)}
.cmp .rk{font-family:var(--f-mono);color:var(--ink-faint);width:40px}
.cmp .mkt{display:flex;align-items:center;gap:10px;font-weight:700}
.cmp .mkt .iso{height:22px;font-size:10px}
.ibar{display:flex;align-items:center;gap:10px}.ibar .n{min-width:92px}
.ibar .t{flex:1;height:6px;border-radius:3px;background:var(--paper-2);min-width:60px}
.ibar .t span{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* reporte */
.rp-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:22px 0}
.rp-nav-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-low);font-weight:700}
.crumb b{color:var(--ink)}
.rp-id{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.rp-id .iso{height:32px;font-size:12px}
.rp-country{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:-.02em;text-transform:uppercase}
.rp-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.rp-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:18px}
.rp-h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.4vw,44px);line-height:1.04;letter-spacing:-.025em;text-transform:uppercase;margin:0 0 16px;text-wrap:balance}
.rp-lead{color:var(--ink-mid);max-width:62ch;margin:0}
.rp-lead b{color:var(--ink)}
.rp-body .radar{width:min(100%,250px)}
.rp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-low);font-weight:700;margin-bottom:8px}
.stat .vn{font-family:var(--f-display);font-weight:700;font-size:14px;margin-bottom:4px}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:clamp(19px,2vw,25px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.split-vs{font-family:var(--f-serif);font-style:italic;font-weight:800;font-size:28px;color:var(--ink-faint)}
.split-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.split-card.cur{border-color:var(--accent)}
.split-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low);font-weight:700;display:flex;align-items:center;gap:8px}
.qpill{background:var(--paper-2);color:var(--ink);border-radius:6px;padding:2px 8px}
.cur .qpill{background:var(--accent);color:#fff}
.split-big{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums}
.split-cap{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.split-m{display:flex;gap:28px;margin-top:14px;font-size:12px;color:var(--ink-low);flex-wrap:wrap}
.split-m strong{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.insight{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-top:14px;border-left:3px solid var(--cel-2);padding:12px 16px;background:var(--card);border-radius:0 12px 12px 0}
.insight .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.insight .txt{flex:1;min-width:220px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-mid)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.legend i.band{height:10px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.chart{width:100%;min-height:200px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-low);font-family:var(--f-mono);font-size:10.5px}
.chart .xh{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:3 3}
.seg-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:26px;align-items:start}
.seg-rows{display:flex;flex-direction:column;gap:18px}
.seg-row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) minmax(0,9rem);gap:14px;align-items:center}
.seg-name{font-weight:700;display:flex;align-items:center;gap:8px}
.track{height:22px;background:var(--paper);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.seg-val{font-family:var(--f-display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.seg-sub{font-size:12px;color:var(--ink-low)}
.rk-rows{display:flex;flex-direction:column;gap:7px}
.rk-row{display:grid;grid-template-columns:28px minmax(0,13rem) minmax(0,1fr) minmax(0,10rem);gap:12px;align-items:center;padding:5px 6px;border-radius:8px}
.rk-row.me{background:var(--accent-soft)}
.rk-rank{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint)}
.rk-name{font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.rk-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-row.me .rk-name{font-weight:700}
.rk-track{height:14px}
.rk-fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.rk-fill.gg{background:#8C87BE}
.me .rk-fill{background:var(--accent)}
.rk-val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-mid)}
.tu{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.12em;background:var(--accent);color:#fff;border-radius:4px;padding:2px 5px;flex:none}
.own{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-low);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;flex:none}
.hscroll{overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.flip-row{display:flex;gap:14px;width:max-content}
.flip{width:220px;height:260px;perspective:900px;cursor:pointer;scroll-snap-align:start;flex:none}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip:hover .flip-in,.flip:focus-visible .flip-in,.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:16px;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.flip.me .face{border-color:var(--accent);border-top-color:var(--accent)}
.f-rank{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint)}
.f-name{font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:-.02em;text-transform:uppercase;margin:8px 0 auto;line-height:1.1}
.f-lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.f-inv{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.f-met{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px dashed var(--line-2);padding-top:10px;margin-top:10px;font-size:10.5px;color:var(--ink-low)}
.f-met strong{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.f-hint{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--ink-faint);text-align:right;margin-top:8px}
.back h4{margin:0;font-family:var(--f-display);font-size:14px;text-transform:uppercase}
.mix{display:grid;grid-template-columns:4.6rem 1fr 2.4rem;gap:8px;align-items:center;font-size:12px;margin-top:9px}
.mix .t{height:7px;background:var(--paper-2);border-radius:4px}.mix .t span{display:block;height:100%;background:var(--bar);border-radius:4px}
.me .mix .t span{background:var(--accent)}
.mix .p{text-align:right;font-variant-numeric:tabular-nums}
.f-share{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line-2);padding-top:10px}
.f-share .v{font-family:var(--f-display);font-weight:900;font-size:20px}
.ad-row{display:flex;gap:14px;width:max-content}
.ad{width:236px;flex:none;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ad-art{height:156px;background:var(--t);color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ad-art::after{content:"";position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.ad-art .br{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;display:flex;align-items:center;gap:8px}
.ad-art .br .lg{background:#fff;border-radius:6px;padding:2px 5px;display:inline-flex}.ad-art .br .lg img{height:18px;display:block}
.ad-art .hl{font-family:var(--f-display);font-weight:900;font-size:15px;line-height:1.12;text-transform:uppercase;letter-spacing:-.01em;position:relative;z-index:1;max-width:92%}
.ad-art .cta{align-self:flex-start;background:#fff;color:#150A3F;border-radius:999px;font-size:10px;font-weight:700;padding:3px 10px;position:relative;z-index:1}
.ad-meta{padding:12px 14px;font-size:12px;color:var(--ink-low);display:flex;flex-direction:column;gap:3px}
.ad-meta b{color:var(--ink);font-size:13px}
.ad-meta .r{display:flex;justify-content:space-between;gap:8px}
.med-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center}
.donut{width:min(250px,70vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.hole{width:64%;aspect-ratio:1;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.hole .v{font-family:var(--f-display);font-weight:900;font-size:clamp(16px,2vw,21px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hole .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.med-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.med-row{display:grid;grid-template-columns:12px minmax(0,9rem) minmax(0,1fr) 3.6rem;gap:10px;align-items:center;font-size:14px}
.med-row .t{height:8px;background:var(--paper);border-radius:4px}.med-row .t span{display:block;height:100%;border-radius:4px;background:var(--c)}
.med-row .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.disclaimer{margin-top:18px;padding:14px 18px;border-left:3px solid var(--warn-line);background:var(--warn-bg);border-radius:0 10px 10px 0;font-size:12.5px;color:var(--ink-mid);line-height:1.6}
.disclaimer b{color:var(--ink)}
/* ruido TV */
.heat{display:grid;gap:3px;min-width:640px}
.heat .hd{font-family:var(--f-mono);font-size:10px;color:var(--ink-low);text-align:center;text-transform:uppercase}
.heat .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;padding-right:8px;white-space:nowrap}
.heat .nm.me{font-weight:800;color:var(--accent)}
.heat .c{height:30px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.heat .tt{font-family:var(--f-display);font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;padding-left:8px}
.lvl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.lvl div{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-mid)}
.lvl b{display:block;font-family:var(--f-display);font-size:13px;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
/* search y social */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.pair{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr) 3.4rem;gap:10px;align-items:center;font-size:13px;margin-bottom:12px}
.pair .bars{display:flex;flex-direction:column;gap:3px}
.pair .b{height:9px;border-radius:0 4px 4px 0}
.pair .p{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;line-height:1.25}
.sent{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.sent span{height:100%}
.vs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.vs{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c)}
.vs.me{border-color:var(--accent);border-top-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vs .lg{width:46px;height:46px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;margin-bottom:6px}
.vs.me .lg{background:var(--accent)}
.vs h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:-.02em}
.vs .role{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-low);font-weight:700}
.vs p{margin:6px 0 10px;font-size:14px;color:var(--ink-mid)}
.vs .st{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px dashed var(--line-2);padding-top:12px;margin-top:auto}
.vs .st .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-low)}
.vs .st .v{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.proj-banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;background:var(--accent-soft);border:1px solid rgba(47,42,134,.25);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.proj-banner .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-low);font-weight:700}
.proj-banner .big{font-family:var(--f-display);font-size:clamp(26px,3.4vw,34px);font-weight:900;color:var(--accent);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.proj-banner .rng{font-size:13px;color:var(--ink-low)}
.proj-banner .det{flex:1;min-width:230px;font-size:14px;color:var(--ink-mid)}
.proj-banner .det small{display:block;color:var(--ink-low);margin-top:6px;font-size:12px}
.ins-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ins{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:6px}
.ins .n{font-family:var(--f-serif);font-style:italic;font-weight:800;font-size:30px;color:var(--c);line-height:1}
.ins h4{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.2}
.ins .d{font-family:var(--f-mono);font-size:11px;color:var(--ink-low)}
.ins p{margin:4px 0 0;font-size:14px;color:var(--ink-mid)}
.reco{background:var(--deep);color:var(--deep-fg);border-radius:22px;padding:clamp(22px,3vw,34px);margin-top:16px;position:relative;overflow:hidden}
.reco:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cel) 0 70%,var(--cel-2) 70%)}
.reco .kick{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--deep-low);font-weight:700}
.reco .kick .logo img{height:24px}
.reco h3{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,30px);line-height:1.15;letter-spacing:-.02em;text-transform:uppercase;margin:12px 0 24px;text-wrap:balance}
.reco h3 em{font-family:var(--f-serif);font-style:italic;color:var(--cel)}
.reco-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.reco-blk{background:rgba(255,255,255,.07);border-radius:14px;padding:16px}
.reco-blk .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep-low);margin-bottom:10px;font-weight:700}
.flow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.flow .to{color:var(--cel)}
.flow .d{font-family:var(--f-mono);font-size:11px;font-weight:700;background:rgba(255,255,255,.12);border-radius:6px;padding:2px 7px}
.timing{font-family:var(--f-display);font-weight:700;font-size:18px}
.small{font-size:12.5px;color:var(--deep-low);margin-top:6px}
.canal{display:grid;grid-template-columns:5.2rem 1fr 2.6rem;gap:8px;align-items:center;font-size:12.5px;margin-top:7px}
.canal .t{height:7px;background:rgba(255,255,255,.12);border-radius:4px}.canal .t span{display:block;height:100%;border-radius:4px;background:var(--cel)}
.canal .p{text-align:right;font-variant-numeric:tabular-nums}
.reco .src{margin-top:16px;font-size:12px;color:var(--deep-low)}
.page-foot{margin-top:70px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-low)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--deep);color:var(--deep-fg);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:280px;font-variant-numeric:tabular-nums}
#tip .tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--deep-low);margin-bottom:3px}
#tip .tr{display:flex;align-items:center;gap:7px}
#tip .tr i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;outline:1px solid rgba(255,255,255,.3)}
#tip .tr b{margin-left:auto;padding-left:12px}
@media (max-width:960px){.reco-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lvl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .hero,.rp-body,.two{grid-template-columns:1fr}
  .hero .radar{width:min(100%,300px)}.rp-body .radar{display:none}
  .rp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg-body,.med-body{grid-template-columns:1fr}.donut{margin-inline:auto}
  .vs-grid,.ins-grid{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}.split-vs{text-align:center;font-size:20px}
}
@media (max-width:560px){
  .seg-row{grid-template-columns:1fr;gap:6px}
  .rk-row{grid-template-columns:24px minmax(0,1fr) auto;row-gap:4px}.rk-track{grid-column:2 / 4;grid-row:2}
  .med-row{grid-template-columns:12px minmax(0,1fr) 3.4rem}.med-row .t{display:none}
  .reco-grid{grid-template-columns:1fr}.cfg select{width:100%}.cfg label{flex:1 1 100%}.cfg .pbtn{margin-left:0}
}
</style>
</head>

/* utilidades */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf1=new Intl.NumberFormat('es-PE',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf0=new Intl.NumberFormat('es-PE',{maximumFractionDigits:0});
function sol(v){v=v||0;if(Math.abs(v)>=1e6)return 'S/ '+nf1.format(v/1e6)+' M';if(Math.abs(v)>=1e3)return 'S/ '+nf0.format(v/1e3)+' mil';return 'S/ '+nf0.format(v)}
function axisSol(v){if(v===0)return '0';if(v>=1e6)return (v/1e6>=10?nf0.format(v/1e6):nf1.format(v/1e6))+' M';return nf0.format(v/1e3)+' mil'}
const num=v=>nf0.format(Math.round(v||0));
const pct=(v,d=1)=>(d?nf1:nf0).format(v)+'%';
function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const s=[1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(x=>x>=n);return s*p}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* peso regional por medio: TV por población; radio más regional; OOH, digital y prensa más concentrados en Lima */
function raw(x,m,p){
  const lima=x.zone==='Lima';let w=x.pop;
  if(m==='Radio')w=Math.pow(x.pop,.75)*(lima?.8:1.05);
  if(m==='OOH')w=x.pop*(lima?3:1);
  if(m==='Digital')w=x.pop*(lima?1.7:1);
  if(m==='Prensa')w=x.pop*(lima?4:.6);
  if(m==='TVP')w=x.pop*(lima?1.5:1);
  const t=VAR[p].tilt;if(t&&t[x.zone])w*=t[x.zone];
  return w*(.88+.24*rng(hash(p+'|'+x.code+'|'+m))());
}
const wcache={};
function weights(dep,p){
  if(dep.nat)return MK.map(()=>1);
  const k=dep.code+p;if(wcache[k])return wcache[k];
  const all=DEPS.filter(x=>!x.nat&&!x.soon).concat([RESTO]);
  return wcache[k]=MK.map(m=>raw(dep,m,p)/sum(all.map(x=>raw(x,m,p))));
}

/* generador por mercado */
const cache={};
function gen(code){
  if(cache[code])return cache[code];
  const dep=DEPS.find(d=>d.code===code),r=rng(hash('dep'+code));
  const brands=Object.keys(DATA.prod).map(p=>{
    const P=DATA.prod[p],w=weights(dep,p),V=VAR[p];
    const months=P.inv.map(row=>row.map((v,k)=>v*w[k]));
    const insM=P.ins.map(row=>row.map((v,k)=>v*w[k]));
    const tf=dep.nat?1:.85+.3*r();
    const m25=months.slice(0,12).map(sum);
    const m26=MESES.map((_,i)=>i<=LAST?sum(months[12+i]):null);
    const trp26=MESES.slice(0,9).map((_,i)=>P.trp[12+i]*tf);
    const mixA={};MK.forEach((m,k)=>mixA[m]=sum(months.slice(12).map(x=>x[k])));
    const inv=sum(m26);
    const mix={};MK.forEach(m=>mix[m]=inv?mixA[m]/inv:0);
    const b25=sum(m25.slice(0,9));
    const yoy=b25>0?clamp(inv/b25,.25,2.5):1;
    const proj=m25.map((v,i)=>i>LAST?v*yoy:null);
    const ins=sum(insM.slice(12).map(sum));
    return {key:p,name:V.n,own:V.own,seg:V.seg,tone:V.tone,m25,m26,proj,yoy,mix,inv,inv25:sum(m25),ins,trp26,trp:sum(trp26),
      versiones:Math.max(2,Math.round(ins/(40+r()*50))),vehiculos:Math.max(3,Math.round(6+Math.sqrt(ins)*(.5+.4*r()))),
      q2:sum(m26.slice(3,6)),q3:sum(m26.slice(6,9))};
  }).filter(b=>b.inv>0).sort((a,b)=>b.inv-a.inv);
  const inv=sum(brands.map(b=>b.inv));
  brands.forEach((b,i)=>{b.rank=i+1;b.share=b.inv/inv*100});
  const monthly26=MESES.map((_,i)=>i<=LAST?sum(brands.map(b=>b.m26[i])):null);
  const allB=Object.keys(DATA.prod).map(p=>p);
  const monthly25=MESES.map((_,i)=>sum(Object.keys(DATA.prod).map(p=>{const w=weights(dep,p);return sum(DATA.prod[p].inv[i].map((v,k)=>v*w[k]))})));
  const segs=SEGS.map((name,i)=>{const bs=brands.filter(b=>b.seg===i);const media={};MK.forEach(m=>media[m]=sum(bs.map(b=>b.inv*b.mix[m])));return {name,idx:i,inv:sum(bs.map(b=>b.inv)),marcas:bs.length,media}});
  segs.forEach(s=>s.share=s.inv/inv*100);
  const media={};MK.forEach(m=>media[m]=sum(brands.map(b=>b.inv*b.mix[m])));
  const q=(lo,hi)=>({inv:sum(brands.map(b=>sum(b.m26.slice(lo,hi)))),mar:brands.filter(b=>sum(b.m26.slice(lo,hi))>0).length,ins:sum(brands.map(b=>b.inv?b.ins*sum(b.m26.slice(lo,hi))/b.inv:0))});
  const ads=[];
  brands.slice(0,9).forEach(b=>{const n=b.rank<=3?3:b.rank<=6?2:1;for(let k=0;k<n;k++){
    const mk=MK.reduce((best,m)=>b.mix[m]*(.5+r())>b.mix[best]*(.5+r())?m:best,'TV');
    const pcs=MPIECE[mk],hl=VAR[b.key].ads;
    ads.push({b,hl:hl[k%hl.length],medio:mk,pieza:pcs[Math.floor(r()*pcs.length)],dia:1+Math.floor(r()*29),inv:b.inv*(.02+r()*.05)})}});
  ads.sort((a,b)=>b.inv-a.inv);
  const out={dep,brands,inv,ins:sum(brands.map(b=>b.ins)),monthly26,monthly25,segs,media,q2:q(3,6),q3:q(6,9),ads};
  return cache[code]=out;
}

function showTip(html,x,y){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let L=x+14,T=y+14;if(L+w>innerWidth-8)L=x-w-14;if(T+h>innerHeight-8)T=y-h-14;tip.style.left=Math.max(8,L)+'px';tip.style.top=Math.max(8,T)+'px'}
function hideTip(){tip.hidden=true}

const tipRow=(c,l,v)=>`<div class="tr"><i style="--c:${c}"></i>${esc(l)}<b>${v}</b></div>`;

/* gráfico de líneas SVG con crosshair */
function lineChart(host,cfg){
  host._cfg=cfg;const labels=cfg.labels||MESES,N=labels.length,fmt=cfg.fmt||sol,fax=cfg.fax||axisSol;
  const W=Math.max(300,Math.round(host.clientWidth||800)),H=cfg.h||270,L=58,R=16,T=16,B=30;
  let max=0;cfg.series.forEach(s=>{s.values.forEach(v=>{if(v!=null&&v>max)max=v});if(s.band)s.band.high.forEach(v=>{if(v!=null&&v>max)max=v})});
  const top=cfg.max||niceMax(max*1.04),iw=W-L-R,ih=H-T-B;
  const x=i=>L+i*iw/(N-1),y=v=>T+ih-(v/top)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=top*k/4,yy=y(v).toFixed(1);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${+yy+3.5}" text-anchor="end">${fax(v)}</text>`}
  const every=Math.ceil(N/Math.max(2,Math.floor(iw/52)));
  labels.forEach((m,i)=>{if(i%every===0)g+=`<text class="ax" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${m}</text>`});
  cfg.series.forEach(s=>{if(s.band){const idx=s.band.high.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
    if(idx.length){const pts=idx.map(i=>`${x(i).toFixed(1)},${y(s.band.high[i]).toFixed(1)}`).concat(idx.slice().reverse().map(i=>`${x(i).toFixed(1)},${y(s.band.low[i]).toFixed(1)}`));g+=`<polygon points="${pts.join(' ')}" fill="${s.color}" fill-opacity=".16"/>`}}});
  cfg.series.forEach(s=>{let d='',pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="6 5"':''}/>`;
    if(s.markers)s.values.forEach((v,i)=>{if(v!=null&&!(s.skipFirstMarker&&i===s.values.findIndex(z=>z!=null)))g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.6" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`})});
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" visibility="hidden"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.label||'')}">${g}</svg>`;
  const svg=host.querySelector('svg'),xh=svg.querySelector('.xh');
  svg.addEventListener('mousemove',e=>{const b=svg.getBoundingClientRect(),mx=(e.clientX-b.left)*W/b.width;
    const i=clamp(Math.round((mx-L)/iw*(N-1)),0,N-1);xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
    const rows=cfg.series.filter(s=>s.values[i]!=null&&!s.noTip).map(s=>{let v=fmt(s.values[i]);if(s.band&&s.band.low[i]!=null)v+=` <span style="opacity:.7">(${fmt(s.band.low[i])}–${fmt(s.band.high[i])})</span>`;return tipRow(s.color,s.name,v)}).join('');
    if(rows)showTip(`<div class="tt">${labels[i]}</div>${rows}`,e.clientX,e.clientY);else hideTip()});
  svg.addEventListener('mouseleave',()=>{xh.setAttribute('visibility','hidden');hideTip()});
}

  const s3=`<section class="sec"><div class="sec-num">${sn()} — Share of investment</div><h2 class="sec-title">Ranking de <em class="g">variantes</em>.</h2><p class="sec-lead">Ranking por inversión publicitaria ene–sep ${YC} · ${esc(M.name)}.</p>

  const flips=d.brands.map(b=>{const mix=MK.map(k=>[k,b.mix[k]]).filter(x=>x[1]>0).sort((a,z)=>z[1]-a[1]).slice(0,4);

  const s4=`<section class="sec"><div class="sec-num">${sn()} — El dossier</div><h2 class="sec-title">Jugadores. <em class="g">Dales la vuelta</em>.</h2><p class="sec-lead">Frente: inversión, inserciones, TRPs y versiones. Dorso: mix de medios y share of investment. Pasa el cursor o toca una tarjeta.</p><div class="hscroll"><div class="flip-row">${flips}</div></div></section>`;

  const s5=`<section class="sec"><div class="sec-num">${sn()} — Creatividad en mercado</div><h2 class="sec-title">Testigos <em class="g">en acción</em>.</h2><p class="sec-lead">Piezas monitoreadas por medio y formato, ordenadas por inversión estimada. En el producto real cada testigo abre la creatividad original.</p><div class="hscroll"><div class="ad-row">${ads}</div></div></section>`;

    <div class="seg-ctl" role="group" aria-label="Filtrar mix de medios">${['Total',...d.brands.slice(0,6).map(b=>b.key)].map(o=>`<button type="button" data-media="${esc(o)}" aria-pressed="${o===state.mediaSel}">${esc(o==='Total'?'Total mercado':VAR[o].n)}</button>`).join('')}</div>

  const qv=p=>{if(!lv.length)return 0;const x=p*(lv.length-1),i=Math.floor(x),f=x-i;return lv[i]+(lv[Math.min(lv.length-1,i+1)]-lv[i])*f};
  const cut=[qv(.75),qv(.5),qv(.25)];

  const tvC=tvB.find(b=>b.own!==GG),cAvg=avgOn(c);
  const s7=`<section class="sec"><div class="sec-num">${sn()} — Ruido en TV</div><h2 class="sec-title">Quién hace <em class="g">ruido</em> en TV.</h2><p class="sec-lead">TRPs mensuales HM 25+ ABC por variante en ${YC}. La intensidad agrupa a las variantes en cuatro niveles de presión, como en el análisis de TV Noise.</p>

  /* 08 search y social (nacional) */
  const sm=DATA.sosMonths,SB=['Gloria','Laive','Bonlé','Ideal','Pura Vida'],SC={Gloria:'var(--s1)',Laive:'var(--s5)','Bonlé':'var(--s2)',Ideal:'var(--s4)','Pura Vida':'var(--s3)'};

  const pmx=Math.max(...pairs.flatMap(p=>[p.sos,p.soi]));
  const s8=`<section class="sec"><div class="sec-num">${sn()} — Search y conversación</div><h2 class="sec-title">Lo que el Perú <em class="g">busca</em>.</h2><p class="sec-lead">Share of search de leche evaporada (Google, Perú) frente al share of investment. Dato nacional: Keyword Planner no abre por departamento.</p>
    <div class="two"><div class="card"><div class="card-head"><div><div class="card-t">Share of search mensual</div><div class="note">% de las búsquedas de marca de leche evaporada</div></div><div class="legend">${SB.slice(0,4).map(b=>`<span><i style="--c:${SC[b]}"></i>${b}</span>`).join('')}</div></div><div class="chart" id="chSos"></div><div class="foot">El pico de diciembre (chocolatada) y el valle de enero–febrero se repiten en ambos años.</div></div>
    <div class="card"><div class="card-head"><div><div class="card-t">SOS vs SOI · ene–sep ${YC}</div><div class="note">Barra oscura = búsqueda · barra clara = inversión</div></div></div>
      ${pairs.map(p=>`<div class="pair"><span style="font-weight:700">${p.n}</span><span class="bars"><span class="b" style="width:${(p.sos/pmx*100).toFixed(1)}%;background:var(--s1)"></span><span class="b" style="width:${(p.soi/pmx*100).toFixed(1)}%;background:var(--cel)"></span></span><span class="p">${pct(p.sos,0)}<br><span style="color:var(--ink-low)">${pct(p.soi,0)}</span></span></div>`).join('')}
      <div class="key" style="margin-top:14px"><div class="key-t">Lectura clave</div>${pairs.filter(p=>p.n!=='Gloria').sort((a,b)=>(b.sos-b.soi)-(a.sos-a.soi)).slice(0,1).map(p=>`<b>${p.n}</b> se busca más de lo que invierte (${pct(p.sos,0)} de búsqueda vs ${pct(p.soi,0)} de inversión): su marca trabaja sola y es la amenaza latente.`).join('')}</div>
      <div class="card-t" style="margin-top:22px;font-size:13px">Conversación social · nov ${YC}</div>
      <div class="sent"><span style="width:31%;background:var(--s4)"></span><span style="width:54%;background:var(--other)"></span><span style="width:15%;background:var(--bad)"></span></div>
      <div class="legend"><span><i style="--c:var(--s4)"></i>Positivo 31%</span><span><i style="--c:var(--other)"></i>Neutral 54%</span><span><i style="--c:var(--bad)"></i>Negativo 15%</span></div>
      <div class="foot" style="margin-top:12px">Muestra de 99 menciones de Grupo Gloria (LinkedIn 46, Facebook 18, prensa 15, TikTok 7, Instagram 6, X 5). La conversación es más corporativa que de producto; las recetas (chocolate caliente) generan la mayor interacción.</div></div></div></section>`;

  /* 09 cara a cara */
  const flank=d.brands.find(b=>b.own===c.own&&!isMe(b)&&b!==rival)||d.brands.find(b=>!isMe(b)&&b!==rival);
  const top2=d.brands.find(b=>!isMe(b));
  const third=rival&&rival!==top2?rival:flank;
  const vsCard=(b,role,txt,mine)=>`<div class="vs${mine?' me':''}" style="--c:${b.tone}"><div class="lg">${esc(initials(b.name))}</div><h3>${esc(b.name)}</h3><div class="role">${role}</div><p>${txt}</p><div class="st"><div><div class="k">Inversión</div><div class="v">${sol(b.inv)}</div></div><div><div class="k">SOI</div><div class="v">${pct(b.share)}</div></div><div><div class="k">TRPs</div><div class="v">${num(b.trp)}</div></div><div><div class="k">Ranking</div><div class="v">#${b.rank}</div></div></div></div>`;
  const mainMed=b=>MSHORT[MK.reduce((a,k)=>b.mix[k]>b.mix[a]?k:a,'TV')];
  const s9=`<section class="sec"><div class="sec-num">${sn()} — ${me} vs competencia</div><h2 class="sec-title">${me} vs <em class="g">el retador</em>.</h2><p class="sec-lead">La marca foco frente a su competidor externo más fuerte y frente a ${flank&&flank.own===c.own?'su propio portafolio':'el siguiente jugador'}.</p>
    <div class="vs-grid">
      ${vsCard(c,'Marca foco',`${me} es #${c.rank} con ${pct(c.share)} de SOI y una variación de ${c.yoy>=1?'+':''}${nf0.format((c.yoy-1)*100)}% frente a ${YP}. Su medio principal es ${mainMed(c)}.`,true)}

    </div></section>`;

  /* 10 proyección */
  const s10=`<section class="sec"><div class="sec-num">${sn()} — Proyección</div><h2 class="sec-title">Lo que <em class="g">viene</em>.</h2><p class="sec-lead">Octubre a diciembre proyectados con la estacionalidad de ${YP} escalada por el ritmo interanual. El área sombreada es el rango estimado.</p>
    <div class="seg-ctl" role="group" aria-label="Alcance de la proyección">${[['mkt','Mercado'],['me',meName()],['rival',rival?rival.name:'Retador']].map(([k,l])=>`<button type="button" data-proj="${k}" aria-pressed="${k===state.projSel}">${esc(l)}</button>`).join('')}</div>
    <div id="projBox"></div></section>`;

  /* 11 insights + jugada */
  const peak=[9,10,11].sort((a,b)=>c.m25[b]-c.m25[a]).slice(0,2).sort((a,b)=>a-b).map(i=>MESES[i]);
  const cProj=sum(c.proj.filter(v=>v!=null));

  const leader=c.rank===1;

  const delta=cProj?(needQ4/cProj-1)*100:0;
  const compTv=Math.max(0,...d.brands.filter(b=>b.own!==c.own).map(avgOn));
  const grp=Math.round(clamp(leader?Math.max(compTv*1.25,cut[0]):Math.max(compTv*1.1,cut[1]),60,1450)/10)*10;
  const rfAt=g=>{const R=DATA.rf;for(let i=1;i<R.length;i++)if(R[i][0]>=g){const a=R[i-1],b=R[i],t=(g-a[0])/(b[0]-a[0]);return [a[1]+t*(b[1]-a[1]),a[2]+t*(b[2]-a[2])]}return [R[R.length-1][1],R[R.length-1][2]]};
  const rf=rfAt(grp),rfNow=rfAt(clamp(cAvg,50,1450));
  const sug=leader?{TV:.55,Digital:.2,OOH:.12,Radio:.1,TVP:.03}:{TV:.5,Digital:.2,OOH:.15,Radio:.12,TVP:.03};
  const sugL=Object.entries(sug).sort((a,b)=>b[1]-a[1]);
  const ins=[
    {c:'var(--s1)',h:`${esc(L.name)} ${leader?'(foco) ':''}lidera la pauta`,d:`SOI ${pct(L.share)} · ${sol(L.inv)}`,t:`Grupo Gloria suma ${pct(ggS,0)} de la inversión y ${pct(totT?ggT/totT*100:0,0)} de los TRPs: el ruido de la categoría es mayormente propio.`},
    {c:'var(--s5)',h:rival?`${esc(rival.name)}: el retador externo`:'Sin retador externo',d:rival?`SOI ${pct(rival.share)} · ${rival.yoy>=1?'+':''}${nf0.format((rival.yoy-1)*100)}% vs ${YP}`:'',t:rival?`${rival.yoy<.7?'Se replegó en '+YC+', pero mantiene share of search: puede volver en cualquier momento.':'Sostiene su presencia y obliga a defender el frente '+esc(SEGS[rival.seg].toLowerCase())+'.'}`:''},
    {c:'var(--s2)',h:'La eficiencia está en los TRPs',d:`${me}: ${num(cAvg)} TRPs/mes al aire · nivel ${lvl(cAvg)}`,t:leader?`Con ${num(grp)} GRPs al mes ${me} seguiría por encima de cualquier competidor externo. El resto puede ir a sin lactosa, digital o regiones.`:`Para entrar al nivel ${lvl(grp)} hace falta un piso de ${num(grp)} GRPs al mes.`}
  ];
  const s11=`<section class="sec"><div class="sec-num">${sn()} — Insights y plan</div><h2 class="sec-title">Insights y <em class="g">la jugada</em>.</h2><p class="sec-lead">Lectura de enero a septiembre y una recomendación para el cierre del año.</p>
    <div class="ins-grid">${ins.map((x,i)=>`<div class="ins" style="--c:${x.c}"><div class="n">0${i+1}</div><h4>${x.h}</h4><div class="d">${x.d}</div><p>${x.t}</p></div>`).join('')}</div>
    <div class="reco"><div class="kick">${logoChip(24)}La jugada ${me} · estimación</div>
      <h3>${leader?`De <em>${sol(cProj)}</em> a <em>${sol(needQ4)}</em> en Q4: mantener el #1 con menos presión y reinvertir lo liberado.`:`De <em>${sol(cProj)}</em> a <em>${sol(needQ4)}</em> en Q4 para pelear el #${Math.max(1,c.rank-1)}.`}</h3>
      <div class="reco-grid">
        <div class="reco-blk"><div class="lbl">Inversión Q4 · inercia → sugerida</div><div class="flow"><span>${sol(cProj)}</span><span>→</span><span class="to">${sol(needQ4)}</span><span class="d">${delta>=0?'+':''}${nf0.format(delta)}%</span></div></div>
        <div class="reco-blk"><div class="lbl">Timing crítico</div><div class="timing">${peak.join(' · ')} ${YC}</div><div class="small">Chocolatada y fiestas: los meses de mayor búsqueda y pauta en ${YP}.</div></div>
        <div class="reco-blk"><div class="lbl">Presión y alcance (4 semanas)</div><div class="flow"><span class="to">${num(grp)} GRPs</span></div><div class="small">Alcance 1+ <b style="color:var(--deep-fg)">${pct(rf[0]*100,0)}</b> · 3+ <b style="color:var(--deep-fg)">${pct(rf[1]*100,0)}</b> (hoy ${pct(rfNow[0]*100,0)} / ${pct(rfNow[1]*100,0)})</div></div>
        <div class="reco-blk"><div class="lbl">Mix sugerido</div>${sugL.map(([k,v])=>`<div class="canal"><span>${MSHORT[k]}</span><span class="t"><span style="width:${(v/sugL[0][1]*100).toFixed(0)}%"></span></span><span class="p">${pct(v*100,0)}</span></div>`).join('')}</div>
      </div>
      <div class="src">Estimación heurística sobre la data competitiva. Alcance según curva RF IBOPE HM 20–65 ABC a 4 semanas. En el producto real se alimenta con el plan de medios de Gloria.</div>
    </div></section>`;
  return hero+s1+s2+s3+s4+s5+s6+s7+s8+s9+s10+s11;
}

function renderMedia(d){
  const box=document.getElementById('mediaCard');if(!box)return;
  const sel=state.mediaSel,b=d.brands.find(x=>x.key===sel);
  const media=b?Object.fromEntries(MK.map(k=>[k,b.inv*b.mix[k]])):d.media,total=sum(Object.values(media));
  let items=MK.map(k=>[k,media[k]]).filter(x=>x[1]/total>=.03).sort((a,b)=>b[1]-a[1]);
  const otros=sum(MK.filter(k=>media[k]/total<.03).map(k=>media[k]));if(otros>0)items.push(['Otros',otros]);
  const col=k=>k==='Otros'?'var(--other)':MCOL[k],lbl=k=>k==='Otros'?'Otros medios':MLBL[k];
  let acc=0;const stops=[];
  items.forEach(([k,v])=>{const a=acc*3.6,e=(acc+v/total*100)*3.6;stops.push(`${col(k)} ${a.toFixed(2)}deg ${(e-1.2).toFixed(2)}deg`,`var(--card) ${(e-1.2).toFixed(2)}deg ${e.toFixed(2)}deg`);acc+=v/total*100});
  const rows=items.map(([k,v])=>`<div class="med-row" data-tip="${esc(`<div class='tt'>${esc(lbl(k))}</div>${tipRow(col(k),'Inversión',sol(v))}${tipRow(col(k),'Participación',pct(v/total*100))}`)}"><span class="dot" style="--c:${col(k)}"></span><span>${esc(lbl(k))}</span><span class="t"><span style="--c:${col(k)};width:${(v/items[0][1]*100).toFixed(1)}%"></span></span><span class="p">${pct(v/total*100)}</span></div>`).join('');
  const nm=b?b.name:'el mercado',second=items.slice(1).filter(x=>x[0]!=='Otros').slice(0,2).map(x=>lbl(x[0]));
  box.innerHTML=`<div class="card-head"><div><div class="card-t">Mix de medios · ${esc(b?b.name:'Total mercado')}</div><div class="note">Inversión por tipo de medio · ${esc(d.dep.name)} · soles</div></div></div>
    <div class="med-body"><div class="donut" style="background:conic-gradient(${stops.join(',')})" role="img" aria-label="Mix de medios"><div class="hole"><div class="v">${sol(total)}</div><div class="l">${b?'Total variante':'Total mercado'}</div></div></div>
    <div><div class="med-list">${rows}</div><div class="key"><div class="key-t">Lectura clave</div><b>${esc(lbl(items[0][0]))}</b> concentra <b>${pct(items[0][1]/total*100)}</b> de la inversión de ${esc(nm)}.${second.length?` ${esc(second.join(' y '))} forman el segundo bloque de presencia.`:''}</div></div></div>
    <div class="foot">Medios con menos de 3% se agrupan en “Otros medios”.</div>`;
}

function renderProj(d){
  const box=document.getElementById('projBox');if(!box)return;
  const c=focusOf(d),rival=d.brands.find(b=>b.own!==c.own);
  let real,base,prev,scope,yoy;const spread=.12;
  const sel=state.projSel==='rival'&&!rival?'mkt':state.projSel;
  if(sel==='mkt'){real=d.monthly26;base=MESES.map((_,i)=>i>LAST?sum(d.brands.map(b=>b.proj[i])):null);prev=d.monthly25;scope='Mercado';yoy=sum(d.monthly26.slice(0,9))/sum(d.monthly25.slice(0,9))}
  else{const b=sel==='me'?c:rival;real=b.m26;base=b.proj;prev=b.m25;scope=b.name;yoy=b.yoy}
  const ytd=sum(real.slice(0,LAST+1)),ps=sum(base.filter(v=>v!=null));
  const color=sel==='rival'?'var(--s5)':'var(--accent)';
  const j=a=>a.map((v,i)=>i===LAST?real[LAST]:v);
  const low=base.map(v=>v==null?null:v*(1-spread)),high=base.map(v=>v==null?null:v*(1+spread));
  box.innerHTML=`<div class="proj-banner"><div style="display:flex;flex-direction:column;gap:2px"><span class="k">Cierre ${YC} proyectado · ${esc(scope)}</span><span class="big">${sol(ytd+ps)}</span><span class="rng">Rango ${sol(ytd+ps*(1-spread))} – ${sol(ytd+ps*(1+spread))}</span></div>
    <div class="det">Real a septiembre: <b>${sol(ytd)}</b> + proyección oct–dic: <b>${sol(ps)}</b><small>Método: estacionalidad ${YP} × ritmo interanual (×${nf1.format(yoy)}) · banda ±${spread*100}%</small></div></div>
    <div class="card"><div class="card-head"><div><div class="card-t">Real + proyección · ${esc(scope)}</div><div class="note">Inversión mensual en soles · área sombreada = rango estimado</div></div><div class="legend"><span><i style="--c:var(--prev)"></i>${YP}</span><span><i style="--c:${color}"></i>${YC} real</span><span><i class="dash" style="--c:${color}"></i>Proyección</span><span><i class="band" style="--c:${color}"></i>Rango</span></div></div><div class="chart" id="chProj"></div></div>`;
  lineChart(document.getElementById('chProj'),{label:'Proyección',series:[
    {name:String(YP),values:prev,color:'var(--prev)',width:1.5},
    {name:'Proyección',values:j(base),color,dash:true,markers:true,skipFirstMarker:true,band:{low:j(low),high:j(high)}},
    {name:YC+' real',values:real,color,markers:true,width:2.5}]});
}

/* render y navegación */
const app=document.getElementById('app');
function render(keep){
  const y=scrollY;
  if(state.view==='home')app.innerHTML=viewHome();
  else{
    const d=gen(state.view);
    if(state.mediaSel!=='Total'&&!d.brands.some(b=>b.key===state.mediaSel))state.mediaSel='Total';
    app.innerHTML=viewReport(state.view);
    if(focusOf(d)){
      lineChart(document.getElementById('chRitmo'),{label:'Inversión mensual',series:[{name:String(YP),values:d.monthly25,color:'var(--prev)',markers:true,width:2},{name:String(YC),values:d.monthly26,color:'var(--accent)',markers:true,width:2.5}]});
      const sm=DATA.sosMonths,totS=sm.map((_,i)=>sum(Object.values(DATA.sos).map(a=>a[i])));
      const SC={Gloria:'var(--s1)',Laive:'var(--s5)','Bonlé':'var(--s2)',Ideal:'var(--s4)'};
      lineChart(document.getElementById('chSos'),{label:'Share of search',labels:sm.map(s=>MESES[+s.slice(5)-1]+' '+s.slice(2,4)),fmt:v=>pct(v),fax:v=>nf0.format(v)+'%',max:100,h:250,
        series:Object.keys(SC).map(b=>({name:b,values:DATA.sos[b].map((v,i)=>v/totS[i]*100),color:SC[b],width:b==='Gloria'?2.5:2}))});
      renderMedia(d);renderProj(d);
    }
  }
  app.insertAdjacentHTML('beforeend',`<footer class="page-foot"><span>Radar Competitivo Gloria · <b>datos dummy</b>: la estructura (variantes, medios, estacionalidad, TRPs, share of search, curva RF y conversación social) se calibró con las bases reales y las cifras se perturbaron. La apertura por departamento es ilustrativa.</span><span>Corte: septiembre ${YC} · Powered by WPP Media</span></footer>`);
  scrollTo(0,keep?y:0);
}
function go(code){state.view=code;try{history.replaceState(null,'',code==='home'?location.pathname+location.search:'#'+code.toLowerCase())}catch(e){}render(false)}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.getAttribute('data-go'));return}
  const m=e.target.closest('[data-media]');if(m){state.mediaSel=m.getAttribute('data-media');app.querySelectorAll('[data-media]').forEach(b=>b.setAttribute('aria-pressed',b===m));renderMedia(gen(state.view));return}
  const p=e.target.closest('[data-proj]');if(p){state.projSel=p.getAttribute('data-proj');app.querySelectorAll('[data-proj]').forEach(b=>b.setAttribute('aria-pressed',b===p));renderProj(gen(state.view));return}
  const f=e.target.closest('.flip');if(f&&matchMedia('(hover: none)').matches)f.classList.toggle('on');
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target;if(t.matches('tr[data-go]')){e.preventDefault();go(t.getAttribute('data-go'))}else if(t.classList.contains('flip')){e.preventDefault();t.classList.toggle('on')}});

const fSel=document.getElementById('fSel');
fSel.innerHTML=Object.entries(VAR).filter(([k])=>gen('PE').brands.some(b=>b.key===k)).map(([k,v])=>`<option value="${k}">${esc(v.n)} · ${esc(v.own)}</option>`).join('');
fSel.value=state.focus;
fSel.addEventListener('change',()=>{state.focus=fSel.value;state.projSel='mkt';save();render(true)});
const cfg=document.getElementById('cfg'),fab=document.getElementById('fab');
document.getElementById('presBtn').addEventListener('click',()=>{cfg.hidden=true;fab.hidden=false});
fab.addEventListener('click',()=>{cfg.hidden=false;fab.hidden=true;scrollTo({top:0})});
const h=(location.hash||'').slice(1).toUpperCase();
if(h&&DEPS.some(m=>m.code===h&&!m.soon))state.view=h;
render(false);
})();
</script>
